<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#091522"><title>كروت المراجعة | كيمياء تالتة ثانوي</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#081321;--panel:#112238;--line:#2b4055;--ink:#edf7ff;--muted:#9bb0c4;--teal:#54dfca;--gold:#e2c17b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 85% 0%,#17444a 0,transparent 38%),var(--bg);color:var(--ink);font:16px/1.8 Tajawal,sans-serif}.wrap{max-width:960px;margin:auto;padding:26px 18px 60px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px}.eyebrow,.face{color:var(--gold);font-weight:700}.title{font:600 clamp(1.8rem,5vw,2.7rem)/1.4 'Reem Kufi',sans-serif;margin:8px 0}.muted{color:var(--muted)}a{color:var(--teal);text-decoration:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.stat,.panel{background:linear-gradient(145deg,#152941,#0e1c2d);border:1px solid var(--line);border-radius:18px;padding:15px}.stat b{display:block;color:var(--teal);font:600 1.8rem 'Reem Kufi',sans-serif}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.controls input,.controls select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#0c1a2a;color:var(--ink);font:inherit}.cats,.actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.cats button,.btn{border:1px solid var(--line);background:#14263b;color:var(--ink);border-radius:99px;padding:9px 15px;font:700 .95rem Tajawal;cursor:pointer}.cats button[aria-pressed=true],.primary{background:var(--teal);color:#06221d;border-color:var(--teal)}.stage{max-width:720px;margin:24px auto}.progress{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.9rem}.track{height:6px;background:#20364a;border-radius:9px;margin:8px 0 14px;overflow:hidden}.track i{display:block;height:100%;background:var(--teal);width:0;transition:width .2s}.flash{width:100%;min-height:270px;padding:25px;border:1px solid #36766f;border-radius:24px;background:radial-gradient(circle at 80% 0%,#1c625c55,transparent 48%),linear-gradient(145deg,#152b40,#0c1929);color:var(--ink);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;text-align:center;cursor:pointer;box-shadow:0 20px 55px #0004}.flash.answer{border-color:var(--gold)}.question{font:600 clamp(1.25rem,3vw,1.8rem)/1.7 'Reem Kufi',sans-serif}.hint{color:var(--muted);font-size:.9rem}.actions{justify-content:center}.actions .btn{border-radius:12px}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.foot{text-align:center;color:var(--muted);font-size:.9rem;margin-top:18px}@media(max-width:560px){.controls{grid-template-columns:1fr}.stats{gap:7px}.stat{padding:10px}.flash{min-height:245px;padding:18px}}
</style></head><body><div class="wrap">
<header><div><span class="eyebrow">KAREEM CHEMISTRY · مراجعة ذكية</span><h1 class="title">كروت المراجعة السريعة</h1><p class="muted">فكّر في الإجابة الأول، وبعدها اضغط على الكارت علشان تكشفها.</p></div><a href="./#home">العودة للموقع ↗</a></header>
<div class="stats"><div class="stat"><b id="total">0</b><span class="muted">كارت في المجموعة</span></div><div class="stat"><b id="seen">0</b><span class="muted">تمت مراجعتها</span></div><div class="stat"><b id="known">0</b><span class="muted">كروت أتقنتها</span></div></div>
<div class="controls"><input id="search" type="search" placeholder="ابحث عن تعريف أو قانون أو مصطلح..." aria-label="بحث في الكروت"><select id="mode" aria-label="فلترة الكروت"><option value="all">كل الكروت</option><option value="needs">تحتاج مراجعة</option><option value="known">الكروت المتقنة</option></select></div>
<div class="cats" id="cats"><button data-cat="الكل" aria-pressed="true">الكل</button><button data-cat="تعريفات" aria-pressed="false">تعريفات</button><button data-cat="قوانين" aria-pressed="false">قوانين</button><button data-cat="معادلات" aria-pressed="false">معادلات</button><button data-cat="مفاهيم" aria-pressed="false">مفاهيم</button></div>
<section class="stage"><div class="progress"><span id="pos">0 / 0</span><span id="category">ابدأ المراجعة</span></div><div class="track"><i id="bar"></i></div>
<button class="flash" id="flash" type="button"><span class="face" id="face">السؤال</span><span class="question" id="question">جارٍ تجهيز الكروت…</span><span class="hint" id="hint">اضغط على الكارت لكشف الإجابة</span></button>
<div class="actions"><button class="btn" id="prev" type="button">السابق ←</button><button class="btn primary" id="next" type="button">التالي →</button><button class="btn" id="random" type="button">كارت عشوائي ⤨</button></div>
<div class="actions" id="rate" hidden><button class="btn primary" id="yes" type="button">✓ عرفته</button><button class="btn" id="again" type="button">↻ محتاج أراجعه</button></div></section>
<p class="foot">تقدمك بيتحفظ على نفس الجهاز تلقائيًا. دي كروت مراجعة مختصرة؛ ارجع لشرح الدرس عند الحاجة للتفاصيل.</p></div>
<script>
(()=>{'use strict';
const cards=[
['mol','تعريفات','ما المقصود بالمول؟','كمية من المادة تحتوي على عدد أفوجادرو من الكيانات الأولية، ويساوي تقريبًا 6.022 × 10²³ كيانًا.'],
['na','مفاهيم','ما قيمة عدد أفوجادرو؟','6.022 × 10²³ مول⁻¹، وهو عدد الكيانات الأولية في مول واحد.'],
['molar','تعريفات','ما المقصود بالكتلة المولية؟','كتلة مول واحد من المادة، ووحدتها الشائعة g/mol.'],
['n','قوانين','كيف نحسب عدد المولات من الكتلة؟','عدد المولات (n) = الكتلة (m) ÷ الكتلة المولية (M).'],
['m','قوانين','كيف نحسب كتلة كمية من المادة؟','الكتلة (m) = عدد المولات (n) × الكتلة المولية (M).'],
['ph','قوانين','ما العلاقة الرياضية لحساب pH؟','pH = −log[H⁺]، حيث [H⁺] هو التركيز المولاري لأيونات الهيدروجين.'],
['poh','قوانين','ما العلاقة بين pH و pOH عند 25°C؟','pH + pOH = 14 في المحاليل المائية عند 25°C.'],
['kw','قوانين','ما قيمة حاصل تأين الماء Kw عند 25°C؟','Kw = [H⁺][OH⁻] = 1.0 × 10⁻¹⁴.'],
['neutral','مفاهيم','متى يكون المحلول متعادلًا عند 25°C؟','عندما يتساوى تركيز H⁺ مع تركيز OH⁻، ويكون pH = 7.'],
['kc','قوانين','ما المقصود بثابت الاتزان Kc؟','نسبة حاصل ضرب تراكيز النواتج إلى حاصل ضرب تراكيز المتفاعلات عند الاتزان، وكل تركيز مرفوع لمعامله في المعادلة الموزونة.'],
['qc','مفاهيم','ماذا تعني مقارنة Qc بـ Kc؟','إذا Qc أصغر من Kc يتجه التفاعل للأمام، وإذا Qc أكبر من Kc يتجه للخلف، وإذا تساويا يكون النظام عند الاتزان.'],
['ox','تعريفات','ما المقصود بالأكسدة؟','فقد الإلكترونات، ويصاحبه ارتفاع في عدد التأكسد.'],
['red','تعريفات','ما المقصود بالاختزال؟','اكتساب الإلكترونات، ويصاحبه انخفاض في عدد التأكسد.'],
['oxidizer','مفاهيم','ما العامل المؤكسد؟','المادة التي تكتسب إلكترونات من مادة أخرى، ولذلك تتعرض هي للاختزال.'],
['reducer','مفاهيم','ما العامل المختزل؟','المادة التي تفقد إلكترونات لمادة أخرى، ولذلك تتعرض هي للأكسدة.'],
['cell','قوانين','كيف نحسب جهد الخلية القياسي؟','E°cell = E°cathode − E°anode، باستخدام جهود الاختزال القياسية.'],
['faraday','قوانين','ما قانون فاراداي لحساب كتلة المادة المترسبة؟','m = (M × I × t) ÷ (n × F)، حيث M الكتلة المولية وI شدة التيار وt الزمن وn عدد الإلكترونات وF ثابت فاراداي.'],
['hydrate','تعريفات','ما المقصود بماء التبلر؟','جزيئات ماء تدخل في التركيب البلوري لبعض الأملاح بنسبة محددة، وتُكتب ضمن الصيغة الكيميائية للملح المائي.'],
['alkane','معادلات','ما الصيغة العامة للألكانات مفتوحة السلسلة؟','CₙH₂ₙ₊₂، وهي هيدروكربونات مشبعة تحتوي على روابط أحادية فقط بين ذرات الكربون.'],
['alkene','معادلات','ما الصيغة العامة للألكينات مفتوحة السلسلة ذات رابطة مزدوجة واحدة؟','CₙH₂ₙ، وتحتوي على رابطة مزدوجة واحدة بين ذرتي كربون.'],
['alkyne','معادلات','ما الصيغة العامة للألكاينات مفتوحة السلسلة ذات رابطة ثلاثية واحدة؟','CₙH₂ₙ₋₂، وتحتوي على رابطة ثلاثية واحدة بين ذرتي كربون.'],
['alcohol','مفاهيم','ما المجموعة الوظيفية المميزة للكحولات؟','مجموعة الهيدروكسيل (−OH) المرتبطة بذرة كربون.'],
['acid','مفاهيم','ما المجموعة الوظيفية في الأحماض الكربوكسيلية؟','مجموعة الكربوكسيل (−COOH).'],
['ester','مفاهيم','ما المجموعة الوظيفية المميزة للإسترات؟','المجموعة (−COO−) بين جزأي المركب العضوي.']
];
const $=id=>document.getElementById(id),key='kareemChemReviewProgressV1';let progress={};try{progress=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch(e){}
let cat='الكل',mode='all',query='',list=[],index=0,flipped=false;
function filtered(){return cards.filter(c=>(cat==='الكل'||c[1]===cat)&&(!query||(c[2]+' '+c[3]+' '+c[1]).toLocaleLowerCase().includes(query))&&(mode==='all'||(mode==='needs'&&progress[c[0]]!=='known')||(mode==='known'&&progress[c[0]]==='known')))}
function stats(){$('total').textContent=list.length;$('seen').textContent=cards.filter(c=>progress[c[0]]==='known'||progress[c[0]]==='again').length;$('known').textContent=cards.filter(c=>progress[c[0]]==='known').length}
function render(){list=filtered();index=Math.min(Math.max(index,0),Math.max(0,list.length-1));flipped=false;const c=list[index];stats();$('pos').textContent=list.length?(index+1)+' / '+list.length:'0 / 0';$('bar').style.width=list.length?((index+1)/list.length*100)+'%':'0%';$('rate').hidden=true;$('flash').classList.remove('answer');$('flash').disabled=!c;if(!c){$('face').textContent='لا توجد نتائج';$('question').textContent='جرّب تغيير التصنيف أو كلمة البحث.';$('hint').textContent='';$('category').textContent='0 كارت';return}$('face').textContent='السؤال';$('question').textContent=c[2];$('hint').textContent='فكّر في الإجابة، ثم اضغط لكشفها';$('category').textContent=c[1]+(progress[c[0]]==='known'?' · متقن':progress[c[0]]==='again'?' · يحتاج مراجعة':'')}
function flip(){const c=list[index];if(!c)return;flipped=!flipped;$('flash').classList.toggle('answer',flipped);$('face').textContent=flipped?'الإجابة':'السؤال';$('question').textContent=flipped?c[3]:c[2];$('hint').textContent=flipped?'قيّم مراجعتك من الأزرار بالأسفل':'اضغط لكشف الإجابة';$('rate').hidden=!flipped}
function move(n){if(!list.length)return;index=(index+n+list.length)%list.length;render()}
function rate(value){const c=list[index];if(!c)return;progress[c[0]]=value;try{localStorage.setItem(key,JSON.stringify(progress))}catch(e){}if((mode==='needs'&&value==='known')||(mode==='known'&&value!=='known'))render();else{stats();move(1)}}
$('flash').addEventListener('click',flip);$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('random').onclick=()=>{if(!list.length)return;let n=index;if(list.length>1)while(n===index)n=Math.floor(Math.random()*list.length);index=n;render()};$('yes').onclick=()=>rate('known');$('again').onclick=()=>rate('again');$('search').oninput=e=>{query=e.target.value.trim().toLocaleLowerCase();index=0;render()};$('mode').onchange=e=>{mode=e.target.value;index=0;render()};$('cats').onclick=e=>{const b=e.target.closest('button[data-cat]');if(!b)return;cat=b.dataset.cat;document.querySelectorAll('#cats button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));index=0;render()};render();
})();
</script></body></html>
