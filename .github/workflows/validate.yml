name: Validate project

on:
  push:
    branches:
      - main
      - security-hardening-2026-11
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        with:
          node-version: 22
        uses: actions/setup-node@v4
      - name: Check Cloudflare API syntax
        run: node --check "functions/api/[[path]].js"
      - name: Check inline scripts and JSON
        run: node scripts/validate-html.mjs
