name: Validate project

on:
  push:
    branches:
      - main
      - ci-workflow-only
      - security-hardening-2026-11
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Cloudflare API syntax
        run: node --check "functions/api/[[path]].js"

      - name: Check inline scripts and JSON
        run: |
          if [ -f scripts/validate-html.mjs ]; then
            node scripts/validate-html.mjs
          else
            echo "Skipping HTML/JSON validation: scripts/validate-html.mjs is not present in this branch."
          fi